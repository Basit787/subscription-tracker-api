services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: subscription-api

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/subscription-db
      REDIS_URL: redis://redis:6379

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started

    command: pnpm dev

  mongodb:
    image: mongo:8

    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:8-alpine

    container_name: redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data: